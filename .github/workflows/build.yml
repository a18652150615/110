name: Build SplitScreenTweak DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Theos 环境
        uses: theosdev/theos-action@v1
        with:
          sdks: iphoneos16.0

      - name: 编译 DEB 包
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SplitScreenTweak-deb
          path: packages/*.deb
