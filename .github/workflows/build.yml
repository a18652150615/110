name: Build SplitScreenTweak DEB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        uses: theosdev/theos-action@v1
        with:
          sdks: iphoneos16.0
          
      - name: Build Package
        run: |
          make clean package THEOS_PACKAGE_SCHEME=rootless
          
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitScreenTweak-deb
          path: packages/*.deb
