- name: 手动打 rootless deb
  run: |
    rm -rf pkg
    mkdir -p pkg/DEBIAN
    mkdir -p "pkg/var/jb/Library/MobileSubstrate/DynamicLibraries"
    mkdir -p "pkg/var/jb/Library/PreferenceBundles/SPPrefs.bundle"

    DYLIB=$(find . -name "SplitScreenTweak.dylib" | head -1)
    cp "$DYLIB" "pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/SplitScreenTweak.dylib"

    cat > "pkg/var/jb/Library/MobileSubstrate/DynamicLibraries/SplitScreenTweak.plist" << 'PLIST'
    {
        Filter = { Bundles = ( "com.apple.springboard" ); };
    }
    PLIST

    # 复制设置 bundle
    cp SPPrefs.bundle/Info.plist "pkg/var/jb/Library/PreferenceBundles/SPPrefs.bundle/Info.plist"
    cp SPPrefs.bundle/Root.plist "pkg/var/jb/Library/PreferenceBundles/SPPrefs.bundle/Root.plist"

    # 设置注册文件
    mkdir -p "pkg/var/jb/Library/PreferenceBundles"
    cat > "pkg/var/jb/Library/PreferenceBundles/SPPrefs.plist" << 'PLIST'
    {
        File = SPPrefs;
        Label = "SplitScreen";
    }
    PLIST

    cat > pkg/DEBIAN/control << 'CTRL'
    Package: com.yourname.splitscreentweak
    Name: SplitScreenTweak
    Version: 1.1.0
    Architecture: iphoneos-arm64e
    Description: Split screen with settings
    Maintainer: Your Name
    Author: Your Name
    Section: Tweaks
    Depends: mobilesubstrate, preferenceloader
    CTRL

    mkdir -p out
    dpkg-deb -b pkg out/SplitScreenTweak.deb
    dpkg-deb -c out/SplitScreenTweak.deb
